name: Build and test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config libgtk-3-dev libxapp-dev
      - name: Configure
        run: meson setup build -Dwerror=true
      - name: Build
        run: meson compile -C build
      - name: Storage and safety tests
        run: meson test -C build --print-errorlogs

